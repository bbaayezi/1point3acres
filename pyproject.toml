[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onepoint3acres-daily"
version = "0.2.0"
description = "Resilient personal daily check-in client for 1Point3Acres"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
  "2captcha-python>=2.1.0,<3",
  "requests>=2.32.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "responses>=0.25,<1",
  "ruff>=0.12,<1",
  "types-requests>=2.32,<3",
]

[project.scripts]
onepoint3acres = "onepoint3acres.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onepoint3acres = ["question_bank.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: read-only checks against public endpoints"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["onepoint3acres"]

[[tool.mypy.overrides]]
module = ["twocaptcha"]
ignore_missing_imports = true
